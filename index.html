<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tacón Nhora - TuMercado360</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            margin: 0; 
            padding: 0; 
            background-color: #e5e7eb; 
            color: #1f2937; 
        }
        .container { 
            max-width: 500px; 
            margin: 0 auto; 
            background: #ffffff; 
            min-height: 100vh;
            box-shadow: 0 0 20px rgba(0,0,0,0.1); 
        }
        .funnel-images img {
            width: 100%;
            height: auto;
            display: block;
            margin: 0;
            padding: 0;
        }
        .form-section {
            padding: 24px;
            background-color: #ffffff;
            border-top: 4px solid #f3f4f6;
        }
        h2 { 
            font-size: 24px; 
            font-weight: 800;
            line-height: 1.2;
            margin: 0 0 8px 0; 
            text-align: center;
        }
        .subtitle {
            text-align: center;
            color: #4b5563;
            margin-bottom: 24px;
            font-size: 15px;
        }
        .form-group { 
            margin-bottom: 16px; 
        }
        .form-row {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
        }
        .form-row .form-group {
            margin-bottom: 0;
            flex: 1;
        }
        label { 
            display: block; 
            margin-bottom: 6px; 
            font-weight: 600; 
            font-size: 14px; 
            color: #374151;
        }
        input[type="text"], select { 
            width: 100%; 
            padding: 14px; 
            border: 1px solid #d1d5db; 
            border-radius: 8px; 
            box-sizing: border-box; 
            font-size: 16px; 
            background-color: #f9fafb;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus, select:focus {
            outline: none;
            border-color: #6b7280;
            background-color: #ffffff;
        }
        .upsell-box { 
            border: 2px solid #b91c1c; 
            padding: 16px; 
            border-radius: 12px; 
            background: #fef2f2; 
            margin: 24px 0; 
        }
        .upsell-title {
            color: #b91c1c;
            font-weight: 800;
            margin-bottom: 12px;
            display: block;
            text-align: center;
            font-size: 15px;
        }
        .radio-option { 
            display: flex; 
            align-items: center; 
            cursor: pointer; 
            font-size: 14px; 
            padding: 12px;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            margin-bottom: 8px;
            background: #fff;
            transition: all 0.2s;
        }
        .radio-option input[type="radio"] { 
            margin-right: 12px; 
            transform: scale(1.3); 
            accent-color: #b91c1c;
        }
        .highlight {
            font-weight: 700;
            color: #b91c1c;
        }
        .cta-button { 
            width: 100%; 
            padding: 18px; 
            background-color: #25D366; 
            color: white; 
            border: none; 
            border-radius: 8px; 
            font-size: 18px; 
            font-weight: 800; 
            cursor: pointer; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            gap: 10px;
            box-shadow: 0 4px 6px rgba(37, 211, 102, 0.2);
            transition: transform 0.1s;
        }
        .cta-button:active { 
            transform: scale(0.98); 
        }
        .guarantee {
            text-align: center;
            font-size: 13px;
            color: #6b7280;
            margin-top: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="funnel-images">
            <img src="5.png" alt="Luce elegante y camina cómoda">
            <img src="3.png" alt="Antes y después">
            <img src="4.png" alt="Gana altura y estiliza">
            <img src="1.png" alt="Póntelos fácilmente">
            <img src="8.png" alt="Pasos para ponerlos">
            <img src="2.png" alt="Detalle del calzado">
            <img src="6.png" alt="Disfruta tus eventos">
            <img src="10.png" alt="Oferta Especial - $187.000">
            <img src="7.png" alt="Testimonios de clientas">
            <img src="9.png" alt="Preguntas Frecuentes">
        </div>

        <div class="form-section">
            <h2>Pide los tuyos ahora</h2>
            <div class="subtitle">Pagas $187.000 al recibir en la puerta de tu casa.</div>

            <form id="order-form">
                <div class="form-group">
                    <label for="nombre">Nombre completo</label>
                    <input type="text" id="nombre" placeholder="Ej. Camila Restrepo" required>
                </div>

                <div class="form-group">
                    <label for="direccion">Dirección y Ciudad</label>
                    <input type="text" id="direccion" placeholder="Ej. Calle 45 #12-34, Medellín" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="color">Color</label>
                        <select id="color" required>
                            <option value="" disabled selected>Elige un color...</option>
                            <option value="Marfil">Marfil</option>
                            <option value="Nude">Nude</option>
                            <option value="Negro">Negro</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="talla">Talla (Horma normal)</label>
                        <select id="talla" required>
                            <option value="" disabled selected>Tu talla...</option>
                            <option value="34">34</option>
                            <option value="35">35</option>
                            <option value="36">36</option>
                            <option value="37">37</option>
                            <option value="38">38</option>
                            <option value="39">39</option>
                            <option value="40">40</option>
                        </select>
                    </div>
                </div>

                <div class="upsell-box">
                    <span class="upsell-title">🔥 OFERTA ESPECIAL DE SEGUNDO PAR 🔥</span>
                    
                    <label class="radio-option">
                        <input type="radio" name="cantidad" value="1 par ($187.000)" required checked>
                        <span>Llevar solo 1 par ($187.000)</span>
                    </label>
                    
                    <label class="radio-option" style="background: #fff;">
                        <input type="radio" name="cantidad" value="2 pares (¡Segundo par con 65% OFF!)">
                        <span class="highlight">Llevar 2 pares (El 2do par con 65% DESCUENTO)</span>
                    </label>
                </div>

                <button type="submit" class="cta-button">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg>
                    Comprar y Confirmar por WhatsApp
                </button>
                <div class="guarantee">
                    🚚 Pago Contra Entrega • 🔒 Compra Segura
                </div>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('order-form').addEventListener('submit', function(e) {
            e.preventDefault();

            const nombre = document.getElementById('nombre').value.trim();
            const direccion = document.getElementById('direccion').value.trim();
            const color = document.getElementById('color').value;
            const talla = document.getElementById('talla').value;
            const cantidad = document.querySelector('input[name="cantidad"]:checked').value;

            const numeroDestino = "573114360726";
            
            const mensaje = `¡Hola! Acabo de hacer una compra en la tienda. 👠\n\n*Datos para el envío contra entrega:*\n👤 Nombre: ${nombre}\n📍 Dirección: ${direccion}\n\n*Detalle del pedido:*\n🎨 Color: ${color}\n📏 Talla: ${talla}\n📦 Promoción elegida: ${cantidad}\n\nQuedo atento/a para confirmar el despacho.`;

            const urlWhatsApp = `https://wa.me/${numeroDestino}?text=${encodeURIComponent(mensaje)}`;
            window.location.href = urlWhatsApp;
        });
    </script>
</body>
</html>
